<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Hi, ich bin Niklas - Homelab, Automatisierung, Self-Hosting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07142b"/><stop offset="0.6" stop-color="#061a2e"/><stop offset="1" stop-color="#062a35"/></linearGradient>
    <radialGradient id="gl" cx="0.85" cy="0" r="0.9"><stop offset="0" stop-color="#0b5cff" stop-opacity="0.45"/><stop offset="1" stop-color="#0b5cff" stop-opacity="0"/></radialGradient>
    <pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity="0.06"/></pattern>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="r"><rect x="1" y="1" width="998" height="258" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#gl)"/>
    <rect width="1000" height="260" fill="url(#gr)"/>
    <g stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M700 70 L790 120 L880 60 L940 150 L850 200 L790 120 M700 70 L720 190 L850 200"/>
    </g>
    <g fill="#00e5ff">
      <circle cx="700" cy="70" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="120" r="7"><animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="60" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="150" r="6"><animate attributeName="opacity" values="1;0.4;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="200" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="190" r="4"><animate attributeName="opacity" values="1;0.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="258" rx="20" fill="none" stroke="#17406a" stroke-width="2"/>
  <text x="60" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#00e5ff" opacity="0.55" filter="url(#blur)">Hi, ich bin Niklas</text>
  <text x="60" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Hi, ich bin Niklas</text>
  <text x="62" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#7fe9ff">Homelab  |  Automatisierung  |  Self-Hosting</text>
</svg>
