<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-label="Stats"><rect x="1" y="1" width="518" height="228" rx="16" fill="#0a1626" stroke="#123a5e" stroke-width="1.5"/><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient><clipPath id="tc"><rect x="16" y="1" width="488" height="3"/></clipPath></defs><style>@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sweep{from{transform:translateX(-120px)}to{transform:translateX(520px)}}.g{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}.dot{animation:pulse 2.4s ease-in-out infinite}.sw{animation:sweep 4.5s linear infinite}</style><g clip-path="url(#tc)"><rect class="sw" x="0" y="1" width="120" height="2" fill="url(#sg)"/></g><text x="28" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#00e5ff">Stats</text><circle class="dot" style="animation-delay:0.00s" cx="34" cy="79" r="4" fill="#00e5ff"/><text x="48" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8fb3c9">Sterne</text><text x="492" y="84" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#e7f3ff" text-anchor="end">0</text><circle class="dot" style="animation-delay:0.35s" cx="34" cy="105" r="4" fill="#00e5ff"/><text x="48" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8fb3c9">Öffentliche Repos</text><text x="492" y="110" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#e7f3ff" text-anchor="end">2</text><circle class="dot" style="animation-delay:0.70s" cx="34" cy="131" r="4" fill="#00e5ff"/><text x="48" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8fb3c9">Follower</text><text x="492" y="136" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#e7f3ff" text-anchor="end">1</text><circle class="dot" style="animation-delay:1.05s" cx="34" cy="157" r="4" fill="#00e5ff"/><text x="48" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8fb3c9">Folge ich</text><text x="492" y="162" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#e7f3ff" text-anchor="end">1</text><circle class="dot" style="animation-delay:1.40s" cx="34" cy="183" r="4" fill="#00e5ff"/><text x="48" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8fb3c9">Contributions (12 Mon.)</text><text x="492" y="188" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#e7f3ff" text-anchor="end">2200</text></svg>